<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>PWR - BLACK GOLD PRO CYBER</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

:root{
    --gold:#ffd54a;
    --gold2:#ffb300;
    --gold3:#fff1a8;
    --amber:#ff8f00;
    --purple:#9b5cff;
    --green:#4dff9a;
    --red:#ff4d67;

    --bg:#050505;
    --panel:rgba(18,16,10,.88);
    --text:#f5f1df;
    --muted:#8e8975;
    --line:rgba(255,193,7,.25);
}

html{
    min-height:100%;
    background:#050505;
}

body{
    min-height:100vh;
    color:var(--text);
    overflow-x:hidden;
    padding:30px 20px;
    position:relative;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,193,7,.12),
            transparent 24%
        ),
        radial-gradient(
            circle at 85% 18%,
            rgba(155,92,255,.09),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,143,0,.08),
            transparent 30%
        ),
        #050505;
}

/* GRID BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-3;
    opacity:.45;

    background-image:
        linear-gradient(
            rgba(255,193,7,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,193,7,.035) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 12%,
            black 88%,
            transparent
        );
}

/* GOLD CYBER PORTAL */
body::after{
    content:"";
    position:fixed;

    width:620px;
    height:620px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;
    z-index:-2;

    border:1px solid rgba(255,193,7,.07);
    border-radius:50%;

    box-shadow:
        0 0 100px rgba(255,193,7,.035),
        0 0 220px rgba(155,92,255,.025),
        inset 0 0 120px rgba(255,193,7,.025);

    animation:portal 14s linear infinite;
}

@keyframes portal{
    0%{
        transform:translate(-50%,-50%)
        rotate(0deg)
        scale(.88);
    }

    50%{
        transform:translate(-50%,-50%)
        rotate(180deg)
        scale(1.04);
    }

    100%{
        transform:translate(-50%,-50%)
        rotate(360deg)
        scale(.88);
    }
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;

    display:flex;
    flex-direction:column;
    gap:18px;

    position:relative;
}

/* TITLE */

.neon-title{

}

.neon-title h1{
    font-size:31px;
    font-weight:950;

}

.neon-title span{

@keyframes titleGlow{

    }

/* ===== LOGO TOGEL ON — UKURAN SESUAI REFERENSI ===== */

.togelon-logo{

    margin:0 auto 10px;

@keyframes logoGlow{

.card{

.card::before{

<script>

let parsedList = [];


/* =========================================
   E-WALLET PREFIX
========================================= */

function applyEwalletPrefix(bank,noRek){

    if(
        noRek === '-' ||
        noRek.includes('*')
    ){
        return noRek;
    }

    let upperBank =
        bank.toUpperCase();

    let finalNoRek =
        noRek;


    if(
        upperBank === 'DANA' ||
        upperBank === 'DANA2'
    ){

        if(
            !finalNoRek.startsWith('3901')
        ){

            finalNoRek =
                '3901' + finalNoRek;

        }

    }

    else if(
        upperBank === 'GOPAY'
    ){

        if(
            !finalNoRek.startsWith('70001')
        ){

            finalNoRek =
                '70001' + finalNoRek;

        }

    }

    else if(
        upperBank === 'OVO'
    ){

        if(
            !finalNoRek.startsWith('39358')
        ){

            finalNoRek =
                '39358' + finalNoRek;

        }

    }

    else if(
        upperBank === 'LINKAJA'
    ){

        if(
            !finalNoRek.startsWith('09110')
        ){

            finalNoRek =
                '09110' + finalNoRek;

        }

    }

    return finalNoRek;
}


/* =========================================
   CLEAN NAMA
========================================= */

function cleanNama(text){

    return text

        .replace(
            /\b(REVIEW|Erroroor|SOG|SYSTEM|null|APPROVED|REJECTED|PENDING|PROCESS)\b/gi,
            ''
        )

        .replace(
            /[_-]+/g,
            ' '
        )

        .replace(
            /\s+/g,
            ' '
        )

        .trim();
}


/* =========================================
   PARSER
========================================= */

function parseExcelData(){

    const rawText =
        document
        .getElementById('dataInput')
        .value
        .trim();


    if(!rawText){

        parsedList = [];

        renderTable();

        return;
    }


    const lines =
        rawText.split(/\r?\n/);


    parsedList = [];


    lines.forEach(line => {

        let cleanLine =
            line.trim();


        if(!cleanLine){
            return;
        }


        let cols =
            cleanLine
            .split('\t')
            .map(c => c.trim());


        while(
            cols.length &&
            cols[0] === ''
        ){
            cols.shift();
        }


        while(
            cols.length &&
            cols[cols.length - 1] === ''
        ){
            cols.pop();
        }


        let memberCode = '-';

        let noRek = '-';

        let nama = '-';

        let bank = '-';

        let nominal = '0';


        /* HEADER */

        if(
            cols[0] &&
            (
                cols[0].toUpperCase() ===
                'STATUS'

                ||

                cols[0].toUpperCase() ===
                'MEMBER CODE'
            )
        ){

            return;
        }


        /* FORMAT TAB / EXCEL */

        if(
            cols.length >= 7 &&
            /^(PENDING|PROCESS|APPROVED|REJECTED|REVIEW)$/i
            .test(cols[0])
        ){

            memberCode =
                cols[1] || '-';

            noRek =
                cols[2] || '-';

            nama =
                cleanNama(
                    cols[3] || '-'
                );

            nominal =
                cols[4] || '0';

            bank =
                cols[6] || '-';

        }

        /* FORMAT TEXT */

        else{

            let bankMatch =
                cleanLine.match(
                    /\b(BCA|BRI|BNI|MANDIRI|DANA2|DANA|OVO|LINKAJA|GOPAY|CIMB|PERMATA|SEABANK)\b/i
                );


            bank =
                bankMatch
                ? bankMatch[0].toUpperCase()
                : '-';


            let nominalMatch =
                cleanLine.match(
                    /\b\d{1,3}(?:,\d{3})+(?:\.\d{2})?\b/
                )

                ||

                cleanLine.match(
                    /\b\d{1,3}(?:[.,]\d{3})+\b/
                );


            if(nominalMatch){

                nominal =
                    nominalMatch[0];

            }


            let noRekMatch =
                cleanLine.match(
                    /\b[\d*]{3,20}\b/g
                );


            if(noRekMatch){

                noRek =
                    noRekMatch.sort(
                        (a,b) =>
                            b.replace(/\*/g,'').length -
                            a.replace(/\*/g,'').length
                    )[0];

            }


            let textClean =
                cleanLine;


            if(bank !== '-'){

                textClean =
                    textClean.replace(
                        new RegExp(bank,'gi'),
                        ''
                    );

            }


            if(nominal !== '0'){

                textClean =
                    textClean.replace(
                        nominal,
                        ''
                    );

            }


            if(noRek !== '-'){

                textClean =
                    textClean.replace(
                        noRek,
                        ' '
                    );

            }


            textClean =
                textClean

                .replace(
                    /\b(PROCESS|PENDING|APPROVED|REJECTED|REVIEW|null|SYSTEM|id_\d+)\b/gi,
                    ''
                )

                .replace(
                    /\b\d{2}\/\d{2}\/\d{4}\s\d{2}:\d{2}:\d{2}\b/g,
                    ''
                )

                .replace(
                    /[.,]/g,
                    ''
                )

                .trim();


            let parts =
                textClean
                .split(/\s+/)
                .filter(Boolean);


            if(parts.length){

                memberCode =
                    parts[0];


                if(parts.length > 1){

                    nama =
                        cleanNama(
                            parts
                            .slice(1)
                            .join(' ')
                        );

                }

            }

        }


        if(
            memberCode !== '-' &&
            bank !== '-'
        ){

            parsedList.push({

                memberCode,

                bank,

                noRek:
                    applyEwalletPrefix(
                        bank,
                        noRek
                    ),

                nama,

                nominal

            });

        }

    });


    renderTable();

}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(){

    const tbody =
        document.getElementById(
            'table-body'
        );


    tbody.innerHTML = '';


    if(!parsedList.length){

        tbody.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="empty-row"
            >

                ⟡ DATA KOSONG ⟡

                <br>

                Tempel data transaksi
                untuk memulai sistem.

            </td>

        </tr>

        `;


        document
        .getElementById('pendingCount')
        .innerText = '0';


        document
        .getElementById('totalAmount')
        .innerText = 'Rp 0';


        lucide.createIcons();

        return;
    }


    let totalNominalSum = 0;


    parsedList.forEach(item => {

        let cleanNominal =
            item.nominal

            .replace(
                /Rp\s?/gi,
                ''
            )

            .replace(
                /\.\d{2}$/,
                ''
            )

            .replace(
                /[.,]/g,
                ''
            );


        const numericNominal =
            parseInt(cleanNominal) || 0;


        totalNominalSum +=
            numericNominal;


        let bankClass =
            'bank-default';


        if(
            item.bank.includes('BRI')
        ){

            bankClass =
                'bank-bri';

        }

        else if(
            item.bank.includes('BCA')
        ){

            bankClass =
                'bank-bca';

        }

        else if(
            item.bank.includes('BNI')
        ){

            bankClass =
                'bank-bni';

        }

        else if(
            item.bank.includes('MANDIRI')
        ){

            bankClass =
                'bank-mandiri';

        }

        else if(
            item.bank.includes('DANA')
        ){

            bankClass =
                'bank-dana';

        }

        else if(
            item.bank.includes('OVO')
        ){

            bankClass =
                'bank-ovo';

        }

        else if(
            item.bank.includes('LINKAJA')
        ){

            bankClass =
                'bank-linkaja';

        }

        else if(
            item.bank.includes('GOPAY')
        ){

            bankClass =
                'bank-gopay';

        }

        else if(
            item.bank.includes('SEABANK')
        ){

            bankClass =
                'bank-seabank';

        }


        const tr =
            document.createElement('tr');


        tr.innerHTML = `

            <td>

                <span
                    class="bank-badge ${bankClass}"
                >

                    ${escapeHTML(item.bank)}

                </span>

            </td>


            <td
                style="
                    font-family:monospace;
                    letter-spacing:.5px
                "
            >

                ${escapeHTML(item.noRek)}

            </td>


            <td
                style="
                    color:#ffd54a;
                    font-weight:750;
                    text-shadow:
                    0 0 7px
                    rgba(255,193,7,.35)
                "
            >

                ${escapeHTML(item.memberCode)}

            </td>


            <td
                style="
                    text-transform:capitalize
                "
            >

                ${escapeHTML(
                    item.nama.toLowerCase()
                )}

            </td>


            <td
                style="
                    text-align:right;
                    font-weight:950;
                    color:#fff4bf;
                    text-shadow:
                    0 0 7px
                    rgba(255,193,7,.22)
                "
            >

                ${numericNominal.toLocaleString('en-US')}

            </td>

        `;


        tbody.appendChild(tr);

    });


    document
    .getElementById('pendingCount')
    .innerText =
        parsedList.length;


    document
    .getElementById('totalAmount')
    .innerText =
        'Rp ' +
        totalNominalSum.toLocaleString('en-US');


    lucide.createIcons();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================================
   COPY HASIL
========================================= */

async function copyHasil(button=null){

    if(!parsedList.length){

        showToast(
            '⚠ Belum ada hasil untuk di-copy'
        );

        return;
    }


    const hasil =
        parsedList

        .map(item => {

            let cleanNominal =
                item.nominal

                .replace(
                    /Rp\s?/gi,
                    ''
                )

                .replace(
                    /\.\d{2}$/,
                    ''
                )

                .replace(
                    /[.,]/g,
                    ''
                );


            const numericNominal =
                parseInt(cleanNominal) || 0;


            return [

                item.bank,

                item.noRek,

                item.memberCode,

                item.nama,

                numericNominal
                    .toLocaleString('en-US')

            ].join('\t');

        })

        .join('\n');


    try{

        await navigator
            .clipboard
            .writeText(hasil);


        showToast(
            `✓ ${parsedList.length} HASIL BERHASIL DI-COPY`
        );


        if(button){

            const original =
                button.innerHTML;


            button.classList.add(
                'success'
            );


            button.innerHTML = `

                <i
                    data-lucide="check"
                    size="13"
                ></i>

                COPIED!

            `;


            lucide.createIcons();


            setTimeout(() => {

                button.classList.remove(
                    'success'
                );

                button.innerHTML =
                    original;

                lucide.createIcons();

            },1500);

        }

    }

    catch(err){

        const temp =
            document.createElement(
                'textarea'
            );


        temp.value =
            hasil;


        temp.style.position =
            'fixed';

        temp.style.opacity =
            '0';


        document.body.appendChild(
            temp
        );


        temp.focus();

        temp.select();


        try{

            document.execCommand(
                'copy'
            );


            showToast(
                `✓ ${parsedList.length} HASIL BERHASIL DI-COPY`
            );

        }

        catch(e){

            showToast(
                '❌ GAGAL COPY HASIL'
            );

        }


        document.body.removeChild(
            temp
        );

    }

}


/* =========================================
   PASTE
========================================= */

async function pasteText(){

    try{

        const text =
            await navigator
            .clipboard
            .readText();


        document
        .getElementById('dataInput')
        .value = text;


        parseExcelData();


        showToast(
            '✓ DATA BERHASIL DI-PASTE'
        );

    }

    catch(err){

        alert(
            'Gagal paste otomatis.\n\n' +
            'Gunakan CTRL+V pada kolom teks.'
        );

    }

}


/* =========================================
   CLEAR
========================================= */

function clearAll(){

    document
    .getElementById('dataInput')
    .value = '';


    parsedList = [];


    renderTable();


    showToast(
        '✓ DATA DIBERSIHKAN'
    );

}


/* =========================================
   TOAST
========================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            'toast'
        );


    toast.innerText =
        message;


    toast.classList.add(
        'show'
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                'show'
            );

        },1800);

}


/* =========================================
   INIT
========================================= */

window.onload = function(){

    lucide.createIcons();

    parseExcelData();

};
